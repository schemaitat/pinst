<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 976 496" width="976" height="496" role="img" aria-labelledby="arch-title arch-desc">
  <title id="arch-title">pinst architecture: desired state plus actual state becomes one plan</title>
  <desc id="arch-desc">The manifest and the embedded config tree describe the desired state of a machine; probing the machine yields its actual state. Both feed a single ordered plan, which is either printed by the CLI under dry-run or handed to the executors that write to the machine.</desc>

  <defs>
    <marker id="arch-arrow" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L8 4 L0 8 Z" fill="#6B6B6B"/>
    </marker>
  </defs>

  <rect width="976" height="496" fill="#F5F3EF"/>

  <!-- title block -->
  <text x="40" y="46" font-family="'Instrument Serif', Georgia, 'Times New Roman', serif" font-size="28" font-weight="400" fill="#1A1A1A">How pinst is put together</text>
  <text x="40" y="68" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#6B6B6B" letter-spacing="0.09em">DESIRED STATE + ACTUAL STATE &#8594; ONE PLAN &#8594; PRINT OR EXECUTE</text>

  <!-- ============ CONNECTORS (drawn before boxes) ============ -->
  <g fill="none" stroke="#6B6B6B" stroke-width="1.25" marker-end="url(#arch-arrow)">
    <!-- manifest.toml -> Plan -->
    <path d="M 216 168 H 248 Q 256 168 256 176 V 212 Q 256 220 264 220 H 292"/>
    <!-- configs/ -> Plan -->
    <path d="M 216 264 H 264 Q 272 264 272 256 V 252 Q 272 244 280 244 H 292"/>
    <!-- Probe -> Plan -->
    <path d="M 216 376 H 232 Q 240 376 240 368 V 276 Q 240 268 248 268 H 292"/>
    <!-- Plan -> Execute -->
    <path d="M 472 244 H 548"/>
    <!-- Execute -> This machine -->
    <path d="M 728 244 H 796"/>
    <!-- This machine -> Probe (read the world back) -->
    <path d="M 868 280 V 384 Q 868 392 860 392 H 220"/>
    <!-- Plan -> CLI (dry run prints the plan itself) -->
    <path d="M 380 196 V 136 Q 380 128 388 128 H 532"/>
  </g>

  <!-- ============ ARROW LABELS (masked, 6px clear of stroke) ============ -->
  <g font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="8" fill="#6B6B6B" letter-spacing="0.08em" text-anchor="middle">
    <rect x="493" y="226" width="38" height="12" fill="#F5F3EF"/>
    <text x="512" y="235">APPLY</text>

    <rect x="424" y="110" width="64" height="12" fill="#F5F3EF"/>
    <text x="456" y="119">--DRY-RUN</text>

    <rect x="518" y="374" width="44" height="12" fill="#F5F3EF"/>
    <text x="540" y="383">DETECT</text>
  </g>

  <!-- ============ NODES ============ -->

  <!-- manifest.toml : source of truth (store) -->
  <rect x="40" y="136" width="176" height="64" fill="#F5F3EF"/>
  <rect x="40" y="136" width="176" height="64" rx="6" fill="#EBE9E5" stroke="#6B6B6B" stroke-width="1"/>
  <rect x="52" y="146" width="86" height="13" rx="2" fill="#DFDCD5"/>
  <text x="57" y="155" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="7" fill="#4A4A4A" letter-spacing="0.1em">DESIRED STATE</text>
  <text x="52" y="176" font-family="'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="600" fill="#1A1A1A">manifest.toml</text>
  <text x="52" y="190" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#6B6B6B">tools · deps · tags</text>

  <!-- configs/ : source of truth (store) -->
  <rect x="40" y="232" width="176" height="64" fill="#F5F3EF"/>
  <rect x="40" y="232" width="176" height="64" rx="6" fill="#EBE9E5" stroke="#6B6B6B" stroke-width="1"/>
  <rect x="52" y="242" width="86" height="13" rx="2" fill="#DFDCD5"/>
  <text x="57" y="251" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="7" fill="#4A4A4A" letter-spacing="0.1em">DESIRED STATE</text>
  <text x="52" y="272" font-family="'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="600" fill="#1A1A1A">configs/</text>
  <text x="52" y="286" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#6B6B6B">embedded at build</text>

  <!-- Probe : actual state (process) -->
  <rect x="40" y="344" width="176" height="64" fill="#F5F3EF"/>
  <rect x="40" y="344" width="176" height="64" rx="6" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1"/>
  <rect x="52" y="354" width="78" height="13" rx="2" fill="#EDEBE6"/>
  <text x="57" y="363" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="7" fill="#4A4A4A" letter-spacing="0.1em">ACTUAL STATE</text>
  <text x="52" y="384" font-family="'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="600" fill="#1A1A1A">Probe</text>
  <text x="52" y="398" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#6B6B6B">detect · version</text>

  <!-- Plan : FOCAL -->
  <rect x="296" y="196" width="176" height="96" fill="#F5F3EF"/>
  <rect x="296" y="196" width="176" height="96" rx="6" fill="#FCEDE9" stroke="#E8674C" stroke-width="1.5"/>
  <rect x="308" y="206" width="56" height="13" rx="2" fill="#F7D9D1"/>
  <text x="313" y="215" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="7" fill="#A33A25" letter-spacing="0.1em">THE SPINE</text>
  <text x="308" y="240" font-family="'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="600" fill="#1A1A1A">Plan</text>
  <text x="308" y="256" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#6B6B6B">ordered steps</text>
  <text x="308" y="270" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#6B6B6B">topo-sorted by</text>
  <text x="308" y="282" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#6B6B6B">requires</text>

  <!-- Execute : process -->
  <rect x="552" y="208" width="176" height="72" fill="#F5F3EF"/>
  <rect x="552" y="208" width="176" height="72" rx="6" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1"/>
  <rect x="564" y="218" width="62" height="13" rx="2" fill="#EDEBE6"/>
  <text x="569" y="227" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="7" fill="#4A4A4A" letter-spacing="0.1em">ONE RUNNER</text>
  <text x="564" y="250" font-family="'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="600" fill="#1A1A1A">Execute</text>
  <text x="564" y="264" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#6B6B6B">apt · cargo · curl</text>
  <text x="564" y="276" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#6B6B6B">link · write · backup</text>

  <!-- This machine : external -->
  <rect x="800" y="208" width="136" height="72" fill="#F5F3EF"/>
  <rect x="800" y="208" width="136" height="72" rx="6" fill="#EFEDE9" stroke="#B3B3B3" stroke-width="1"/>
  <rect x="812" y="218" width="50" height="13" rx="2" fill="#E3E0DA"/>
  <text x="817" y="227" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="7" fill="#4A4A4A" letter-spacing="0.1em">EXTERNAL</text>
  <text x="812" y="250" font-family="'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="600" fill="#1A1A1A">This machine</text>
  <text x="812" y="264" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#6B6B6B">$HOME · PATH</text>

  <!-- CLI / TUI : frontend -->
  <rect x="536" y="96" width="200" height="64" fill="#F5F3EF"/>
  <rect x="536" y="96" width="200" height="64" rx="6" fill="#E7E5E1" stroke="#9A9A9A" stroke-width="1"/>
  <rect x="548" y="106" width="58" height="13" rx="2" fill="#DAD7D1"/>
  <text x="553" y="115" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="7" fill="#4A4A4A" letter-spacing="0.1em">FRONTEND</text>
  <text x="548" y="136" font-family="'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="600" fill="#1A1A1A">pinst CLI · TUI</text>
  <text x="548" y="150" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#6B6B6B">--json · exit codes</text>

  <!-- ============ LEGEND (horizontal bottom strip) ============ -->
  <line x1="40" y1="440" x2="936" y2="440" stroke="#E0DDD6" stroke-width="1"/>
  <g font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="8" fill="#6B6B6B" letter-spacing="0.06em">
    <rect x="40" y="460" width="11" height="11" rx="2" fill="#EBE9E5" stroke="#6B6B6B" stroke-width="1"/>
    <text x="58" y="469">SOURCE OF TRUTH</text>

    <rect x="196" y="460" width="11" height="11" rx="2" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1"/>
    <text x="214" y="469">CORE PROCESS</text>

    <rect x="344" y="460" width="11" height="11" rx="2" fill="#FCEDE9" stroke="#E8674C" stroke-width="1.5"/>
    <text x="362" y="469">FOCAL</text>

    <rect x="428" y="460" width="11" height="11" rx="2" fill="#E7E5E1" stroke="#9A9A9A" stroke-width="1"/>
    <text x="446" y="469">FRONTEND</text>

    <rect x="536" y="460" width="11" height="11" rx="2" fill="#EFEDE9" stroke="#B3B3B3" stroke-width="1"/>
    <text x="554" y="469">EXTERNAL</text>
  </g>
</svg>
