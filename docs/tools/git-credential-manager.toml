what = "Git's credential helper: stores and supplies the tokens git uses to talk to GitHub."
when = "Never directly — git invokes it. You notice it when a push starts asking for a password, which means it is missing or unconfigured."
keywords = ["credentials", "auth", "token", "password", "github login", "helper", "gcm"]
status = "draft"
see_also = ["git", "gh"]
gotchas = """
There is no apt package on Ubuntu, so pinst declares this one `manual` and
doctor reports it rather than installing it. The .gitconfig here sets
`[credential] helper = manager`, so git fails on that line if the binary is
absent. It installs under two possible names — git-credential-manager and
git-credential-manager-core — which is why the manifest detects both and
names its help command outright.
"""

[[recipes]]
cmd = "git-credential-manager --help"
does = "Confirm which of the two binary names is present. (unrun here — not installed on this machine)"

[[recipes]]
cmd = "git config --get credential.helper"
does = "What git will actually invoke for credentials."
