# The gate in front of main. Releases are cut from whatever lands there
# (see .github/workflows/release.yml), so "merged" has to mean "checked".
#
# The steps mirror the `qc` recipe in the justfile, in the same order — it is
# already ordered to fail fastest — so a green CI and a green `just qc` mean
# the same thing.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    # Both platforms run fmt/lint/test — that is what catches a
    # std::os::unix assumption or a test that hard-codes a Linux path, the
    # same way TEST-016 (this repo's own manifest.rs/graph.rs tests) already
    # catches a manifest that resolves wrong for a platform, on Linux, by
    # simulation. This job proves it for real, with `Platform::host()` doing
    # the resolving instead of `--platform` standing in for it.
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      - name: Format
        run: cargo fmt --check

      # `--locked` everywhere below: release-please rewrites Cargo.lock in its
      # release PR, and a lockfile that no longer matches Cargo.toml must fail
      # here rather than inside a release build.
      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

      # Reads the embedded manifest as the real binary would on this host —
      # the one thing `--platform macos` run from Linux can never check about
      # itself. No apt step should ever appear in a macOS plan; no findings
      # beyond tool.unsupported.* / tool.manual.* should appear in its doctor
      # report (this checkout has no configs applied yet, so config findings
      # are expected and are not what this step is checking).
      - name: Platform self-check
        if: runner.os == 'macOS'
        run: |
          cargo run --quiet -- plan --platform macos --json | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          bad = [i for i in d['items'] if 'apt-get' in ' '.join(a.get('command','') for a in i.get('actions', []))]
          assert not bad, f'apt step(s) in a macOS plan: {bad}'
          "
          cargo run --quiet -- doctor --platform macos --json | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          bad = [i for i in d['items'] if i['severity'] == 'error' and not i['id'].startswith(('tool.', 'config.'))]
          assert not bad, f'unexpected error-severity finding(s): {bad}'
          "

      # The fourth `qc` step, spelled out like the three above rather than
      # shelling out to `just`, so CI needs no extra tooling. Checks that the
      # skills/commands in .agents/ are wired into the directories the
      # runtime actually reads, and that the .ash/ plan corpus is internally
      # consistent; exits 3 if either has drifted. Linux-only: this is
      # platform-independent
      # work (reading `.ash/`, `git log`), so running it twice would double a
      # `git log`-reading check for no signal.
      #
      # Spelling the steps out here instead of calling `just qc` is what lets
      # this file drift from the justfile, and it did once already: the
      # corpus half became `pinst harness check` and this step went on
      # calling a script that no longer existed. Change one, change the
      # other — there is only the one command now, which is most of the fix.
      - name: Harness
        if: runner.os == 'Linux'
        run: cargo run --quiet -- harness check
